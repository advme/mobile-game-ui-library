<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Fonts</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Luckiest+Guy&family=Titan+One&family=Bangers&family=Fredoka:wght@700&family=Baloo+2:wght@800&family=Changa+One&family=Passion+One:wght@700&family=Sigmar&family=Chango&family=Russo+One&family=Orbitron:wght@900&family=Black+Ops+One&family=Bungee&family=Press+Start+2P&family=Silkscreen:wght@700&family=Cinzel+Decorative:wght@900&family=Knewave&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#fff; padding:28px; font-family:system-ui,sans-serif; }
  h2 { font-size:13px; color:#999; text-transform:uppercase; letter-spacing:1px; margin:28px 0 12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px; max-width:1000px; }
  .card { text-align:center; }
  .name { font-size:13px; color:#333; margin-top:10px; font-weight:600; }
  .note { font-size:12px; color:#999; }

  .btn { font-size:30px; width:100%; padding:12px 10px 16px; border:3px solid #1e1e1e; border-radius:16px; cursor:pointer; position:relative;
         background:linear-gradient(#ffe14d,#ffae00); box-shadow:inset 0 -6px 0 #e08a00, inset 0 3px 0 rgba(255,255,255,.5), 0 4px 0 #1e1e1e; transition:transform .07s; }
  .btn:active { transform:translateY(3px) scale(.97); }

  /* Approved button text style */
  .label { position:relative; display:inline-block; color:#fff; -webkit-text-stroke:3px #1e1e1e; paint-order:stroke fill; isolation:isolate; }
  .label::before { content:attr(data-text); position:absolute; left:0; top:2px; z-index:-1; color:#1e1e1e; -webkit-text-stroke:3px #1e1e1e; }
</style>
</head>
<body>
<div id="app"></div>
<script>
  const groups = [
    ['Casual / cartoon (most popular)', [
      ['Lilita One', 'Current font. Bold and clean'],
      ['Luckiest Guy', 'Comic, playful'],
      ['Titan One', 'Round and chunky'],
      ['Fredoka', 'Soft, friendly, puzzle games'],
      ['Baloo 2', 'Rounded, cute'],
      ['Sigmar', 'Heavy and loud'],
      ['Chango', 'Extra fat, very bold'],
      ['Knewave', 'Brushy, energetic'],
    ]],
    ['Action / numbers', [
      ['Bangers', 'Comic-book action'],
      ['Changa One', 'Great for scores and counts'],
      ['Passion One', 'Tall, compact'],
    ]],
    ['Sci-fi / shooter', [
      ['Russo One', 'Techy, modern'],
      ['Orbitron', 'Space, futuristic'],
      ['Black Ops One', 'Military, stencil'],
      ['Bungee', 'Arcade signage'],
    ]],
    ['Retro / fantasy', [
      ['Press Start 2P', 'Pixel art, retro'],
      ['Silkscreen', 'Pixel, cleaner'],
      ['Cinzel Decorative', 'Fantasy, RPG'],
    ]],
  ];
  const esc = s => s.replace(/"/g,'&quot;');
  document.getElementById('app').innerHTML = groups.map(([title, fonts]) => `
    <h2>${title}</h2>
    <div class="grid">${fonts.map(([f, note]) => {
      const small = f === 'Press Start 2P' ? 'font-size:18px;' : f === 'Cinzel Decorative' ? 'font-size:24px;' : '';
      return `<div class="card">
        <button class="btn" style="font-family:'${f}';${small}"><span class="label" data-text="PLAY x5">PLAY x5</span></button>
        <div class="name">${f}</div><div class="note">${note}</div>
      </div>`;
    }).join('')}</div>`).join('');
</script>
</body>
</html>
