<!doctype html><meta charset="utf-8"><title>Responsive sweep</title><!-- All blocks × 10 screen sizes: no scroll, nothing off-screen, no text under 9px (takes ~3 min). Not in index.html. -->
<style>body{font:13px system-ui;margin:10px} iframe{position:absolute;left:-99999px;top:0;border:0} td,th{padding:3px 8px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top} .bad{color:#c00}</style>
<p id="s">Running…</p><table id="t"><tr><th>block</th><th>size</th><th>result</th></tr></table>
<script>
const BLOCKS=['hud','success','fail','pause','start','reward','daily','settings','shop','loading'];
const SIZES=[[320,568,'SE 1st'],[360,640,'small Android'],[360,780,'S26'],[375,667,'SE'],[402,874,'17 Pro'],[440,956,'17 Pro Max'],[768,1024,'iPad mini'],[1032,1376,'iPad Pro'],[874,402,'phone landscape'],[1440,900,'desktop']];
const OPEN={pause:w=>w.SC.popup.open('pause'),settings:w=>w.SC.popup.open('settings'),daily:w=>w.SC.popup.open('daily')};
(async()=>{
  const rows=[]; let bad=0;
  for(const b of BLOCKS) for(const [w,h,label] of SIZES){
    const f=document.createElement('iframe'); f.width=w; f.height=h; f.style.width=w+'px'; f.style.height=h+'px';
    f.src=`../../super-casual/kit/blocks/${b}.html?embed=1`; document.body.append(f);
    await new Promise(r=>f.onload=r); await new Promise(r=>setTimeout(r,900));
    const win=f.contentWindow, d=f.contentDocument;
    try{ OPEN[b]&&OPEN[b](win); }catch(e){}
    await new Promise(r=>setTimeout(r,700));
    const issues=[];
    const se=d.scrollingElement; if(se.scrollHeight>h+2||se.scrollWidth>w+2) issues.push(`page scrolls ${se.scrollWidth}x${se.scrollHeight}`);
    const vis=[...d.querySelectorAll('.sc-screen:not([hidden]) :is(.sc-button,.sc-icon-button,.sc-counter,.sc-slot,.sc-shopcard,.sc-progress,.sc-title,.sc-tabs,.sc-tabbar,.sc-topbar,.sc-row,.sc-toggle,.sc-slider,.sc-checkbox,.sc-stars,.sc-loading,.sc-banner), .sc-popup:not([hidden]) .sc-popup-box')].filter(e=>e.offsetParent||e.getClientRects().length);
    const off=[]; for(const e of vis){ const r=e.getBoundingClientRect(); if(r.width===0) continue; if(r.left<-2||r.top<-2||r.right>w+2||r.bottom>h+2) off.push((e.className.split(' ')[0])+'@'+[r.left,r.top,r.right,r.bottom].map(Math.round).join(',')); }
    if(off.length) issues.push('off-screen: '+[...new Set(off)].slice(0,4).join(' '));
    // text too small to read (after scaling)
    const small=[...d.querySelectorAll('.sc-text')].filter(t=>t.getClientRects().length&&t.closest(':not([hidden])')).map(t=>{const s=t.closest('.sc-screen'); const k=s?Number(win.getComputedStyle(s).getPropertyValue('--sc-s'))||1:1; return parseFloat(win.getComputedStyle(t).fontSize)*k;}).filter(x=>x>0&&x<9);
    if(small.length) issues.push(`tiny text ${small.length}× (${Math.min(...small).toFixed(1)}px)`);
    const scr=d.querySelector('.sc-screen:not([hidden])'); const scale=scr?Number(win.getComputedStyle(scr).getPropertyValue('--sc-s')).toFixed(2):'-';
    if(issues.length) bad++;
    rows.push([b,`${w}×${h} ${label} (scale ${scale})`,issues.join(' · ')||'OK']);
    f.remove();
  }
  document.getElementById('t').insertAdjacentHTML('beforeend',rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="${r[2]==='OK'?'':'bad'}">${r[2]}</td></tr>`).join(''));
  document.getElementById('s').textContent=`${rows.length-bad} ok, ${bad} with issues`; document.title='DONE';
  window.__rows=rows;
})();
</script>
