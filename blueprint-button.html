<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Blueprint Button</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  body { margin:0; height:100vh; background:#fff; display:grid; place-items:center; font-family:'Lilita One','Arial Black',sans-serif; }

  .item-btn { font-family:inherit; position:relative; width:260px; height:260px; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent;
              border:7px solid #1e1e1e; border-radius:46px; background:linear-gradient(#dedede,#c4c4c4);
              box-shadow:0 5px 0 #1e1e1e; transition:transform .08s ease-out; }
  .item-btn::before { content:""; position:absolute; inset:13px; border-radius:30px;
              background:linear-gradient(#b3b3b3,#a2a2a2); box-shadow:inset 0 0 0 2px #bdbdbd, inset 0 4px 0 rgba(0,0,0,.06); }
  .item-btn:active { transform:translateY(4px) scale(.95); }
  .item-btn.pop { animation:pop .25s ease-out; }
  @keyframes pop { 50%{transform:scale(1.06)} }

  .item-btn .paper { position:absolute; left:50%; top:50%; width:180px; transform:translate(-50%,-50%); pointer-events:none; }

  .count { position:absolute; top:12px; right:20px; font-size:48px; line-height:1; color:#fff; letter-spacing:1px;
           -webkit-text-stroke:4.5px #1e1e1e; paint-order:stroke fill; isolation:isolate; }
  /* 3D bottom: a black copy of the text sits behind, shifted down, so only the bottom edge gets thicker */
  .count::before { content:attr(data-text); position:absolute; left:0; top:3px; z-index:-1; color:#1e1e1e; -webkit-text-stroke:4.5px #1e1e1e; }
</style>
</head>
