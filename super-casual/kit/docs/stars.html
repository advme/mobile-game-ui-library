<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Rating — Super Casual UI Kit</title>
<link rel="stylesheet" href="../core.css">
<link rel="stylesheet" href="../components/stars/stars.css">
<link rel="stylesheet" href="../components/button/button.css">
<link rel="stylesheet" href="docs.css">
<script src="../sc.js"></script>
<script src="docs.js"></script>
<style>.col { display:flex; flex-direction:column; align-items:center; gap:18px; }</style>
</head>
<body>
<script>
  SCDocs.page({
    title: 'Star Rating',
    lead: 'Shows how many stars the player earned — level results, level select, item quality.',
    hero: `<div class="sc-stars" data-value="2" data-layout="arc" data-size="lg" data-animate></div>`,
    css: ['components/stars/stars.css'],
    usageNote: 'The stars build themselves from data-value. No inner HTML.',
    usage: `<div class="sc-stars" data-value="2"></div>`,
    examples: [
      { title:'Values', desc:'0 to 3 earned stars.',
        html:`<div class="col">
  <div class="sc-stars" data-value="0"></div>
  <div class="sc-stars" data-value="1"></div>
  <div class="sc-stars" data-value="2"></div>
  <div class="sc-stars" data-value="3"></div>
</div>` },
      { title:'Arc layout', desc:'Middle star raised, outer stars tilted — for result screens.',
        html:`<div class="sc-stars" data-value="3" data-layout="arc" data-size="lg"></div>` },
      { title:'Sizes', desc:'sm 22px for level buttons and lists · md 44px · lg 96px for result screens.',
        html:`<div class="col">
  <div class="sc-stars" data-size="sm" data-value="2"></div>
  <div class="sc-stars" data-value="2"></div>
  <div class="sc-stars" data-size="lg" data-value="2"></div>
</div>` },
      { title:'Five stars', desc:'data-max up to 5 — for ratings and item quality.',
        html:`<div class="sc-stars" data-max="5" data-value="4"></div>` },
      { title:'Live: earn stars', desc:'data-animate pops stars in one by one. SC.setValue() pops newly earned stars one by one, or empties lost stars. The "star" event fires for each earned star.',
        html:`<div class="col">
  <div class="sc-stars" id="liveStars" data-value="1" data-layout="arc" data-size="lg" data-animate></div>
  <div><button class="sc-button" data-color="red" data-size="sm">-1 Star</button>
  <button class="sc-button" data-color="green" data-size="sm">+1 Star</button>
  <button class="sc-button" data-color="dark" data-size="sm">Replay</button></div>
  <span id="starLog" style="font:600 13px system-ui;color:#b8c4e0">events: —</span>
</div>`,
        setup(preview) {
          const stars = preview.querySelector('#liveStars'), log = preview.querySelector('#starLog');
          const [remove, add, replay] = preview.querySelectorAll('.sc-button');
          remove.onclick = () => SC.setValue(stars, Math.max(+stars.dataset.value - 1, 0));
          stars.addEventListener('star', e => log.textContent = 'events: star ' + (e.detail.index + 1));
          add.onclick = () => SC.setValue(stars, Math.min(+stars.dataset.value + 1, 3));
          replay.onclick = () => { const v = stars.dataset.value; SC.setValue(stars, 0); setTimeout(() => SC.setValue(stars, v), 50); };
        } },
    ],
    api: [
      ['data-value', 'number', '', 'Required. Earned stars.'],
      ['data-max', '1–5', '3', 'Total stars.'],
      ['data-size', 'sm md lg', 'md', '22 / 44 / 96 px.'],
      ['data-layout', 'row arc', 'row', 'arc: raised middle star, tilted outer stars (3 stars).'],
      ['data-animate', 'boolean', '', 'Stars pop in one by one when shown.'],
    ],
    js: `SC.setValue(stars, 3);                         // newly earned stars pop in
stars.addEventListener('star', e => playDing(e.detail.index)); // one event per earned star`,
    rules: [
      '<b>Result screens:</b> <code class="inline">data-layout="arc"</code> + <code class="inline">data-size="lg"</code> + <code class="inline">data-animate</code>, right under the title.',
      '<b>Fail screens</b> show <code class="inline">data-value="0"</code> (all empty), no animation.',
      '<b>Level select buttons and lists:</b> <code class="inline">sm</code>, row layout.',
      '<b>Play a sound</b> on each <code class="inline">star</code> event — rising pitch per star feels best.',
      '<b>3 stars</b> for levels; <code class="inline">data-max="5"</code> only for ratings or item quality.',
    ],
  });
</script>
</body>
</html>
