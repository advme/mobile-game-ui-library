<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level Badge — Super Casual UI Kit</title>
<link rel="stylesheet" href="../core.css">
<link rel="stylesheet" href="../components/level/level.css">
<link rel="stylesheet" href="../components/progress/progress.css">
<link rel="stylesheet" href="../components/button/button.css">
<link rel="stylesheet" href="docs.css">
<script src="../sc.js"></script>
<script src="docs.js"></script>
<style>
.row { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:22px; }
.col { display:flex; flex-direction:column; align-items:center; gap:18px; width:100%; max-width:340px; }
</style>
</head>
<body>
<script>
SCDocs.page({
  title: 'Level Badge',
  lead: 'The player or item level on a shield — alone, or on the left end of an XP bar.',
  hero: `<div class="col">
  <div class="row"><span class="sc-level" data-value="5" data-size="lg"></span><span class="sc-level" data-value="12"></span><span class="sc-level" data-value="99" data-size="sm"></span></div>
  <div class="sc-progress" data-value="723" data-max="1000" data-label="value" data-level="5"></div>
</div>`,
  css: ['components/level/level.css'],
  usageNote: 'Write the number in data-value. On a Progress Bar, add data-level instead.',
  usage: `<span class="sc-level" data-value="5"></span>
<div class="sc-progress" data-value="723" data-max="1000" data-label="value" data-level="5"></div>`,
  examples: [
    { title: 'Sizes', desc: 'sm 32px, md 46px, lg 64px. Up to 3 digits.',
      html: `<div class="row">
  <span class="sc-level" data-value="1" data-size="sm"></span>
  <span class="sc-level" data-value="24"></span>
  <span class="sc-level" data-value="100" data-size="lg"></span>
</div>` },
    { title: 'XP bars', desc: 'data-level on any Progress Bar size and color.',
      html: `<div class="col">
  <div class="sc-progress" data-value="40" data-level="3" data-size="sm" data-color="green"></div>
  <div class="sc-progress" data-value="136" data-max="280" data-label="value" data-level="10"></div>
  <div class="sc-progress" data-value="90" data-label="percent" data-level="42" data-size="lg" data-color="purple"></div>
</div>` },
    { title: 'Live: gain XP and level up', desc: 'Fill the bar; at max the level goes up with a pop and the bar resets.',
      html: `<div class="col">
  <div class="sc-progress" id="xp" data-value="60" data-max="100" data-label="value" data-level="7" data-size="lg"></div>
  <button class="sc-button" data-color="green" data-size="sm" id="gain">+25 XP</button>
</div>`,
      setup(p) {
        const xp = p.querySelector('#xp');
        p.querySelector('#gain').onclick = () => {
          let v = Number(xp.dataset.value) + 25;
          if (v >= 100) {
            SC.setValue(xp, 100);
            setTimeout(() => {
              xp.dataset.level = Number(xp.dataset.level) + 1;
              const badge = xp.querySelector('.sc-level'); badge.classList.remove('sc-pop'); void badge.offsetWidth; badge.classList.add('sc-pop');
              SC.setValue(xp, v - 100);
            }, 500);
          } else SC.setValue(xp, v);
        };
      } },
  ],
  api: [
    ['data-value', 'number', '', 'On .sc-level: the level.'],
    ['data-size', 'sm md lg', 'md', '32 / 46 / 64 px.'],
    ['data-level', 'number', '', 'On .sc-progress: badge on the left end.'],
  ],
  js: `SC.setValue(levelBadge, 6);        // change with a pop
xpBar.dataset.level = '6';          // change the badge on an XP bar
SC.setValue(xpBar, 0);              // reset the bar after level up`,
  rules: [
    'Use for <b>player level</b> (top bar, profile, results XP bar) and <b>item/hero levels</b> on cards.',
    'On a bar, do not also use <code class="inline">data-icon</code> — the badge takes the left end.',
    'Pop it (<code class="inline">SC.setValue</code>) only on real level-ups.',
    'Keep levels to 3 digits max.',
  ],
});
</script>
</body>
</html>
