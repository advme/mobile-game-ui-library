<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkbox — Super Casual UI Kit</title>
<link rel="stylesheet" href="../core.css">
<link rel="stylesheet" href="../components/checkbox/checkbox.css">
<link rel="stylesheet" href="../components/button/button.css">
<link rel="stylesheet" href="docs.css">
<script src="../sc.js"></script>
<script src="docs.js"></script>
<style>
.col { display:flex; flex-direction:column; align-items:flex-start; gap:10px; }
.row { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:18px; }
.log { margin:0; color:#dce6ff; font:14px/1.5 system-ui; }
</style>
</head>
<body>
<script>
SCDocs.page({
  title: 'Checkbox',
  lead: 'A chunky tick box for yes/no choices that are confirmed later or listed together — "Don’t show again", terms, mission checklists.',
  hero: `<div class="col">
  <button class="sc-checkbox" data-checked>Don't show again</button>
  <button class="sc-checkbox">Skip tutorial</button>
</div>`,
  css: ['components/checkbox/checkbox.css'],
  usageNote: 'Use a native button. Text inside becomes the label; the runtime adds the box, the check icon and the checkbox state.',
  usage: `<button class="sc-checkbox" data-checked>Don't show again</button>`,
  examples: [
    { title: 'Checked and unchecked', desc: 'Tap to switch. Checked shows a glossy green box with a white check.',
      html: `<div class="row">
  <button class="sc-checkbox" data-checked aria-label="Checked"></button>
  <button class="sc-checkbox" aria-label="Unchecked"></button>
</div>` },
    { title: 'Sizes', desc: 'sm, md (default) and lg. The tap area stays at least 40px tall.',
      html: `<div class="col">
  <button class="sc-checkbox" data-size="sm" data-checked>Small</button>
  <button class="sc-checkbox" data-checked>Medium</button>
  <button class="sc-checkbox" data-size="lg" data-checked>Large</button>
</div>` },
    { title: 'Colors', desc: 'data-color sets the checked box color.',
      html: `<div class="row">${['green','sky','blue','yellow','orange','red','purple','pink','mint'].map(c => `
  <button class="sc-checkbox" data-checked data-color="${c}" aria-label="${c}"></button>`).join('')}
</div>` },
    { title: 'Disabled', desc: 'Keeps its state but cannot be changed.',
      html: `<div class="col">
  <button class="sc-checkbox" data-checked disabled>Already claimed</button>
  <button class="sc-checkbox" disabled>Locked option</button>
</div>` },
    { title: 'Live: mission checklist', desc: 'Each tap fires one change event. "Complete all" sets them silently with SC.checkbox.set.',
      html: `<div class="col">
  <button class="sc-checkbox" data-mission>Win 3 levels</button>
  <button class="sc-checkbox" data-mission data-checked>Collect 500 coins</button>
  <button class="sc-checkbox" data-mission>Open a chest</button>
  <p class="log">1 / 3 done</p>
  <button class="sc-button" data-color="green" data-size="sm">Complete all</button>
</div>`,
      setup(preview) {
        const items = [...preview.querySelectorAll('[data-mission]')], log = preview.querySelector('.log');
        const report = () => log.textContent = `${items.filter(SC.checkbox.get).length} / ${items.length} done`;
        preview.addEventListener('change', e => e.target.matches('.sc-checkbox') && report());
        preview.querySelector('.sc-button').onclick = () => { items.forEach(i => SC.checkbox.set(i, true)); report(); };
      } },
  ],
  api: [
    ['data-checked', 'empty true false', 'absent', 'Bare or true = checked. Missing or false = unchecked.'],
    ['data-color', 'sky blue dark green yellow orange red purple pink mint', 'green', 'Checked box color.'],
    ['data-size', 'sm md lg', 'md', 'Box 28 / 36 / 46 px.'],
    ['disabled', 'boolean', '', 'Native disabled attribute.'],
    ['text inside', 'text', '', 'Label on the right. Without text, add aria-label.'],
  ],
  js: `box.addEventListener('change', e => save(e.detail.checked));

SC.checkbox.get(box);                      // boolean
SC.checkbox.set(box, true);                // silent
SC.checkbox.set(box, false, { emit: true }); // fires change if it changed
SC.checkbox.toggle(box);                   // invert silently
SC.setLabel(box, 'Never show again');      // change the label`,
  rules: [
    '<b>Checkbox</b> for choices in a list or confirmed by a button (terms, "don’t show again", missions). <b>Toggle</b> for settings that apply instantly.',
    'Always use a native <code class="inline">&lt;button&gt;</code>. Put the label as text inside; use <code class="inline">aria-label</code> only when there is no text.',
    'Listen for <code class="inline">change</code>; do not add a second click handler that inverts it.',
    'Use real booleans with <code class="inline">SC.checkbox.set</code>. Never hand-build the box or check icon.',
    'Keep labels short (1–4 words) so they fit on one line.',
  ],
});
</script>
</body>
</html>
