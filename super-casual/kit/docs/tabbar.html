<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bottom Tab Bar — Super Casual UI Kit</title>
<link rel="stylesheet" href="../core.css">
<link rel="stylesheet" href="../components/screen/screen.css">
<link rel="stylesheet" href="../components/tabbar/tabbar.css">
<link rel="stylesheet" href="../components/bubble/bubble.css">
<link rel="stylesheet" href="../components/title/title.css">
<link rel="stylesheet" href="../components/counter/counter.css">
<link rel="stylesheet" href="docs.css">
<script src="../sc.js"></script>
<script src="docs.js"></script>
<style>
.phone { position:relative; overflow:hidden; width:300px; height:600px; border-radius:26px; border:3px solid #050308; flex:none;
         background:linear-gradient(#3b4a7a, #1e2640); }
.wide { width:100%; max-width:420px; padding-top:18px; }
.log { margin:0; color:#dce6ff; font:14px/1.5 system-ui; text-align:center; }
.col { display:flex; flex-direction:column; align-items:center; gap:30px; }
</style>
</head>
<body>
<script>
const bar = (value, extra = '') => `<nav class="sc-tabbar" data-value="${value}"${extra}>
      <button data-value="shop" data-icon="cash">Shop</button>
      <button data-value="chests" data-icon="chest" data-badge="7" data-badge-color="red">Chests</button>
      <button data-value="play" data-icon="star">Play</button>
      <button data-value="rank" data-icon="trophy" data-badge="2" data-badge-color="green">Rank</button>
      <button data-value="settings" data-icon="settings">Settings</button>
    </nav>`;
SCDocs.page({
  title: 'Bottom Tab Bar',
  lead: 'The main navigation at the bottom of a home screen — Shop, Chests, Play, Rank, Settings. The selected item rises on a glossy block and shows its name.',
  hero: `<div class="phone">
  <div class="sc-screen" data-fit="parent">
    <div class="sc-screen-top" data-align="end"><div class="sc-counter" data-icon="coin" data-value="349810"></div></div>
    <div class="sc-screen-middle"><h1 class="sc-title" data-color="gold">PLAY</h1></div>
    <div class="sc-screen-bottom">
    ${bar('play')}
    </div>
  </div>
</div>`,
  css: ['components/tabbar/tabbar.css', 'components/bubble/bubble.css'],
  usageNote: 'Put it in the bottom region of a Screen Shell. It stretches to the phone edges and leaves room for the iPhone home bar by itself.',
  usage: `<div class="sc-screen-bottom">
  <nav class="sc-tabbar" data-value="play">
    <button data-value="shop" data-icon="cash">Shop</button>
    <button data-value="play" data-icon="star">Play</button>
    <button data-value="rank" data-icon="trophy">Rank</button>
  </nav>
</div>`,
  examples: [
    { title: 'Three items', desc: 'Works with 3–5 items. The label only shows under the selected one.',
      html: `<div class="wide"><nav class="sc-tabbar" data-value="play">
  <button data-value="shop" data-icon="cash">Shop</button>
  <button data-value="play" data-icon="star">Play</button>
  <button data-value="rank" data-icon="trophy">Rank</button>
</nav></div>` },
    { title: 'Colors', desc: 'data-color changes the raised block. Indigo is the default.',
      html: `<div class="col wide">
  <nav class="sc-tabbar" data-color="sky" data-value="b"><button data-value="a" data-icon="gift">Gifts</button><button data-value="b" data-icon="star">Play</button><button data-value="c" data-icon="mail">Mail</button></nav>
  <nav class="sc-tabbar" data-color="orange" data-value="b"><button data-value="a" data-icon="gift">Gifts</button><button data-value="b" data-icon="star">Play</button><button data-value="c" data-icon="mail">Mail</button></nav>
</div>` },
    { title: 'Live: switch screens', desc: 'data-panel points at each screen; the bar shows the selected one and hides the rest. Badges clear when you open Chests.',
      html: `<div class="phone">
  <div class="sc-screen" data-fit="parent" id="sShop" hidden><div class="sc-screen-middle"><h1 class="sc-title" data-color="green">SHOP</h1></div></div>
  <div class="sc-screen" data-fit="parent" id="sChests" hidden><div class="sc-screen-middle"><h1 class="sc-title" data-color="purple">CHESTS</h1></div></div>
  <div class="sc-screen" data-fit="parent" id="sPlay"><div class="sc-screen-middle"><h1 class="sc-title" data-color="gold">PLAY</h1></div></div>
  <div class="sc-screen" data-fit="parent" id="sRank" hidden><div class="sc-screen-middle"><h1 class="sc-title" data-color="blue">RANK</h1></div></div>
  <div class="sc-screen" data-fit="parent">
    <div class="sc-screen-bottom">
      <nav class="sc-tabbar" id="mainBar" data-value="play">
        <button data-value="shop" data-icon="cash" data-panel="sShop">Shop</button>
        <button data-value="chests" data-icon="chest" data-panel="sChests" data-badge="7" data-badge-color="red">Chests</button>
        <button data-value="play" data-icon="star" data-panel="sPlay">Play</button>
        <button data-value="rank" data-icon="trophy" data-panel="sRank">Rank</button>
      </nav>
    </div>
  </div>
</div>
<p class="log">change: —</p>`,
      setup(preview) {
        const barEl = preview.querySelector('#mainBar'), log = preview.querySelector('.log');
        barEl.addEventListener('change', e => {
          log.textContent = 'change: ' + e.detail.value;
          if (e.detail.value === 'chests') SC.setBadge(barEl.querySelector('[data-value="chests"]'), null);
        });
      } },
  ],
  api: [
    ['data-value', 'item value', 'first item', 'On .sc-tabbar: selected item.'],
    ['data-color', 'sky blue green yellow orange red purple pink mint', 'indigo', 'On .sc-tabbar: raised block color.'],
    ['button data-value', 'text', '', 'Required, unique.'],
    ['button data-icon', 'icon-name', '', 'Required kit icon.'],
    ['button text', 'text', '', 'Label under the selected item (1 word).'],
    ['button data-panel', 'element id', '', 'Screen shown only while selected.'],
    ['button data-badge', 'number', '', 'Count bubble on the icon (needs bubble.css).'],
    ['button disabled', 'boolean', '', 'Locked item.'],
  ],
  js: `bar.addEventListener('change', e => openScreen(e.detail.value));

SC.tabbar.get(bar);                         // → 'play'
SC.tabbar.set(bar, 'shop');                 // silent
SC.tabbar.set(bar, 'shop', { emit: true }); // fires change
SC.setBadge(bar.querySelector('[data-value="chests"]'), 3);`,
  rules: [
    'Only on <b>home/menu screens</b>, never during gameplay. Use <b>3–5 items</b>; put the main action (Play) in the middle.',
    'Place it in <code class="inline">.sc-screen-bottom</code> of a <b>separate always-visible screen layer</b>; do not add margins — it bleeds to the edges itself.',
    'Every item needs <code class="inline">data-icon</code> and a 1-word label. Use icons from the kit list only.',
    'Use <code class="inline">data-panel</code> with screen ids, or listen for <code class="inline">change</code>.',
    'Red badges for things to collect, green for good news (rank up).',
  ],
});
</script>
</body>
</html>
