  body: `
<h2>What it is</h2>
<p>Super Casual is plain <b>HTML + CSS</b> plus one small script (<code class="inline">sc.js</code>). The UI floats above the game canvas, so it works with any engine — Three.js, Babylon, Phaser, PixiJS or plain canvas.</p>
<p>Like shadcn/ui, it has two levels:</p>
<ul>
  <li><b>Components</b> — single pieces (Button, Popup, Progress Bar, Tabs…). You write one tag with a few <code class="inline">data-*</code> attributes and the runtime builds the rest.</li>
  <li><b>Blocks</b> — complete copy-paste screens (HUD, Success, Fail, Shop…) built only from components.</li>
</ul>

<h2>The look</h2>
<ul>
  <li>Candy colors, thick dark outlines, a light top band and a darker 3D bottom edge.</li>
  <li>White text with a thin outline and a slightly thicker bottom edge.</li>
  <li>No sharp corners. Icons and pictures are generated images (never drawn with code).</li>
  <li>Everything fits a phone without scrolling and keeps 12px from the screen edges.</li>
</ul>

<h2>For AI agents: how to build a screen</h2>
<ol>
  <li>Read <code class="inline">kit/registry.json</code> — every component (props, events, rules) and every block, plus the list of icon names.</li>
  <li>Start from the closest <b>block</b> in <code class="inline">kit/blocks/</code> and copy it.</li>
  <li>For each component you change, read its manual <code class="inline">kit/components/&lt;name&gt;/&lt;name&gt;.md</code> — especially “Rules for AI agents”.</li>
  <li>Use icon names from <code class="inline">registry.json → icons</code>, or your own picture path/URL — see <a href="images.html">Images</a>. New pictures come from the prompt templates in <code class="inline">kit/assets/IMAGE-PROMPTS.md</code>; never draw pictures in code.</li>
  <li>Talk to the game with events (<code class="inline">change</code>, <code class="inline">buy</code>, <code class="inline">done</code>…) and <code class="inline">SC.*</code> calls.</li>
</ol>
