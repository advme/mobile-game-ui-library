<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Casual Icons</title>
<style>
  body { margin:0; background:#1f2d4b; color:#fff; font-family:system-ui,sans-serif; padding:28px 18px 60px; }
  main { max-width:760px; margin:auto; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:1.5px; color:#8fa0c8; margin:26px 0 12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:12px; }
  figure { margin:0; text-align:center; }
  .tile { aspect-ratio:1; border-radius:14px; background:#2a3a60; display:grid; place-items:center; }
  .tile img { width:66%; height:66%; object-fit:contain; }
  figcaption { font-size:12px; color:#b8c4e0; margin-top:6px; font-family:ui-monospace,monospace; }
</style>
</head>
<body><main><h2>Currency</h2><div class="grid"><figure><div class="tile"><img src="assets/coin.png" alt=""></div><figcaption>coin</figcaption></figure><figure><div class="tile"><img src="assets/gem.png" alt=""></div><figcaption>gem</figcaption></figure><figure><div class="tile"><img src="assets/energy.png" alt=""></div><figcaption>energy</figcaption></figure><figure><div class="tile"><img src="assets/cash.png" alt=""></div><figcaption>cash</figcaption></figure><figure><div class="tile"><img src="assets/ticket.png" alt=""></div><figcaption>ticket</figcaption></figure></div><h2>Rewards</h2><div class="grid"><figure><div class="tile"><img src="assets/gift.png" alt=""></div><figcaption>gift</figcaption></figure><figure><div class="tile"><img src="assets/chest.png" alt=""></div><figcaption>chest</figcaption></figure><figure><div class="tile"><img src="assets/key.png" alt=""></div><figcaption>key</figcaption></figure><figure><div class="tile"><img src="assets/clover.png" alt=""></div><figcaption>clover</figcaption></figure><figure><div class="tile"><img src="assets/ruby.png" alt=""></div><figcaption>ruby</figcaption></figure><figure><div class="tile"><img src="assets/crystal-ball.png" alt=""></div><figcaption>crystal-ball</figcaption></figure></div><h2>Achievements</h2><div class="grid"><figure><div class="tile"><img src="assets/star.png" alt=""></div><figcaption>star</figcaption></figure><figure><div class="tile"><img src="assets/star-empty.png" alt=""></div><figcaption>star-empty</figcaption></figure><figure><div class="tile"><img src="assets/trophy.png" alt=""></div><figcaption>trophy</figcaption></figure><figure><div class="tile"><img src="assets/medal.png" alt=""></div><figcaption>medal</figcaption></figure><figure><div class="tile"><img src="assets/crown.png" alt=""></div><figcaption>crown</figcaption></figure></div><h2>Status</h2><div class="grid"><figure><div class="tile"><img src="assets/heart.png" alt=""></div><figcaption>heart</figcaption></figure><figure><div class="tile"><img src="assets/heart-empty.png" alt=""></div><figcaption>heart-empty</figcaption></figure><figure><div class="tile"><img src="assets/mail.png" alt=""></div><figcaption>mail</figcaption></figure><figure><div class="tile"><img src="assets/chat.png" alt=""></div><figcaption>chat</figcaption></figure><figure><div class="tile"><img src="assets/calendar.png" alt=""></div><figcaption>calendar</figcaption></figure></div><h2>Interface</h2><div class="grid"><figure><div class="tile"><img src="assets/pause.png" alt=""></div><figcaption>pause</figcaption></figure><figure><div class="tile"><img src="assets/close.png" alt=""></div><figcaption>close</figcaption></figure><figure><div class="tile"><img src="assets/check.png" alt=""></div><figcaption>check</figcaption></figure><figure><div class="tile"><img src="assets/lock.png" alt=""></div><figcaption>lock</figcaption></figure><figure><div class="tile"><img src="assets/settings.png" alt=""></div><figcaption>settings</figcaption></figure><figure><div class="tile"><img src="assets/video.png" alt=""></div><figcaption>video</figcaption></figure><figure><div class="tile"><img src="assets/info.png" alt=""></div><figcaption>info</figcaption></figure><figure><div class="tile"><img src="assets/back.png" alt=""></div><figcaption>back</figcaption></figure><figure><div class="tile"><img src="assets/arrow-right.png" alt=""></div><figcaption>arrow-right</figcaption></figure><figure><div class="tile"><img src="assets/search.png" alt=""></div><figcaption>search</figcaption></figure></div></main></body>
</html>
