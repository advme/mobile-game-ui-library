<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button + Health Bar</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  body { margin:0; height:100vh; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:48px; font-family:'Lilita One', 'Arial Black', sans-serif; }

  /* Outlined game text: white fill, dark stroke, drop shadow */
  .game-text { color:#fff; -webkit-text-stroke:5px #1b1b1b; paint-order:stroke fill; text-shadow:0 3px 0 #1b1b1b; }

  /* ---------- Health bar ---------- */
  .health { width:300px; height:34px; background:#1b1b1b; border:3px solid #1b1b1b; border-radius:10px; position:relative; overflow:hidden; }
  .health-track { position:absolute; inset:0; background:#2c2f38; border-radius:7px; }
  .health-lag { position:absolute; left:0; top:0; bottom:0; width:100%; background:#fff; border-radius:7px; transition:width .5s ease-in .25s; }
  .health-fill { position:absolute; left:0; top:0; bottom:0; width:100%; background:#22e52a; border-radius:7px; transition:width .15s ease-out; box-shadow: inset 0 6px 0 rgba(255,255,255,.35), inset 0 -5px 0 rgba(0,0,0,.18); }
  .health-text { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:20px; letter-spacing:.5px; }
  .health.hit { animation:shake .25s; }
  @keyframes shake { 20%{transform:translateX(-5px)} 60%{transform:translateX(5px)} }

  /* ---------- Yellow button ---------- */
  .btn { position:relative; font-family:inherit; font-size:44px; letter-spacing:1px; padding:14px 70px 18px; border:3px solid #1b1b1b; border-radius:18px; cursor:pointer; -webkit-tap-highlight-color:transparent;
         background:linear-gradient(#ffe14d 0%, #ffc61a 45%, #ffae00 100%);
         box-shadow: inset 0 -7px 0 #e08a00, inset 0 3px 0 rgba(255,255,255,.6), 0 5px 0 #1b1b1b;
         transition:transform .07s, box-shadow .07s; }
  .btn::before { content:""; position:absolute; left:10px; right:10px; top:6px; height:30%; border-radius:12px; background:rgba(255,255,255,.28); pointer-events:none; }
  .btn:active { transform:translateY(4px) scale(.97); box-shadow: inset 0 -4px 0 #e08a00, inset 0 3px 0 rgba(255,255,255,.6), 0 1px 0 #1b1b1b; }
</style>
</head>
<body>
  <div class="health" id="health">
    <div class="health-track"></div>
    <div class="health-lag" id="lag"></div>
    <div class="health-fill" id="fill"></div>
    <div class="health-text game-text" id="text">100%</div>
  </div>

  <button class="btn game-text" id="btn">HIT!</button>

<script>
  let hp = 100;
  const $ = id => document.getElementById(id);
  const fill = $('fill'), lag = $('lag'), text = $('text'), bar = $('health'), btn = $('btn');

  btn.onclick = () => {
    const restart = hp <= 0;
    hp = restart ? 100 : Math.max(0, hp - 10);
    fill.style.width = lag.style.width = hp + '%';
    fill.style.background = hp > 50 ? '#22e52a' : hp > 20 ? '#ffc61a' : '#ff3b3b';
    text.textContent = hp + '%';
    btn.textContent = hp <= 0 ? 'RESTART' : 'HIT!';
    if (!restart) { bar.classList.remove('hit'); void bar.offsetWidth; bar.classList.add('hit'); }
  };
</script>
</body>
</html>
