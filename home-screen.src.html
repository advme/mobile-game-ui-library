<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2a4a9a">
<title>Home Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#141a2e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none; touch-action:manipulation; }
  body { background:#1b2242; font-family:'Rajdhani',sans-serif; font-weight:700; -webkit-user-select:none; user-select:none; }
  button { font-family:inherit; font-weight:inherit; color:inherit; outline:none; touch-action:manipulation; }

  /*
    The screen is designed at 460px wide and scaled to fit the device.
    Its width/height stretch to the device's shape, so the top bar sticks to the top,
    the tabs stick to the bottom, and the level content stays centered.
  */
  .screen { position:absolute; left:0; top:0; width:var(--w,460px); height:var(--h,1000px); overflow:hidden; transform-origin:0 0; }
  /* Approved text style: thin outline + 3D bottom edge */
  .t { position:relative; display:inline-block; color:#fff; -webkit-text-stroke:var(--s,4px) var(--ink); paint-order:stroke fill; isolation:isolate; white-space:nowrap; }
  .t::before { content:attr(data-text); position:absolute; left:0; right:0; text-align:inherit; top:var(--d,3px); z-index:-1; color:var(--ink); -webkit-text-stroke:var(--s,4px) var(--ink); }

  .a { position:absolute; object-fit:contain; pointer-events:none; }
  .bg { inset:0; width:100%; height:100%; object-fit:cover; }

  /* Top bar */
  .topbar { position:absolute; left:0; right:0; top:0; height:120px; background:linear-gradient(#2a4a9a,#223a7c); border-bottom:3px solid var(--ink); }
  .xp { position:absolute; left:64px; top:98px; width:84px; height:11px; background:#16224a; border-radius:3px; overflow:hidden; }
  .xp i { position:absolute; inset:0 30% 0 0; background:#1ed4ff; }
  .lvl { position:absolute; left:48px; top:90px; width:28px; height:26px; }
  .lvl .t { position:absolute; left:0; right:0; top:1px; text-align:center; font-size:15px; --s:3px; --d:1.5px; }
  .resources { position:absolute; right:8px; top:78px; height:36px; display:flex; align-items:center; gap:22px; }
  .res { position:relative; display:flex; align-items:center; gap:4px; font-size:17px; --s:3px; --d:2px; }
  .res img { position:static; width:34px; height:34px; object-fit:contain; }

  .icon-btn { position:absolute; padding:0; border:0; background:none; cursor:pointer; transition:transform .07s; }
  .icon-btn:active, .side-btn:active, .icon-btn.pressed, .side-btn.pressed { transform:scale(.92); }

  /* Middle area: the 460x680 content block is centered between top bar and tabs */
  .stage { position:absolute; left:0; right:0; top:120px; bottom:103px; display:flex; align-items:center; justify-content:center; }
  .content { position:relative; width:460px; height:680px; flex:none; }

  .title { position:absolute; left:0; right:0; top:72px; text-align:center; font-size:40px; --s:6px; --d:4px; }
  .sub { position:absolute; left:80px; right:80px; top:116px; height:30px; text-align:center; font-size:17px; --s:3px; --d:2px; padding-top:4px;
         background:linear-gradient(90deg,transparent,rgba(20,30,60,.35) 25%,rgba(20,30,60,.35) 75%,transparent); }

  .edge-layer { position:absolute; left:0; right:0; top:50%; height:680px; margin-top:-340px; pointer-events:none; z-index:1; }
  .edge-layer > * { pointer-events:auto; }
  .side-btn { position:absolute; border:2px solid rgba(20,26,46,.3); border-radius:10px; background:rgba(40,60,110,.28); cursor:pointer; padding:0; }
  .side-btn .t { position:absolute; left:0; right:0; font-size:12px; --s:3px; --d:2px; text-align:center; }
  .alert { position:absolute; width:24px; height:24px; border-radius:50%; border:2px solid #fff; background:linear-gradient(#ff4b4b,#d81f2a);
           display:grid; place-items:center; font-size:17px; --s:3px; --d:1.5px; box-shadow:0 0 0 2px var(--ink); }

  .start { position:absolute; left:128px; top:554px; width:206px; height:80px; border:3px solid var(--ink); border-radius:12px; cursor:pointer;
           background:linear-gradient(#ffd21c,#ffb400); box-shadow:inset 0 -6px 0 #e59400, inset 0 3px 0 rgba(255,255,255,.5), 0 3px 0 var(--ink); transition:transform .07s; }
  .start:active, .start.pressed { transform:translateY(3px) scale(.97); }
  .start .big { position:absolute; left:0; right:0; top:4px; font-size:36px; --s:5px; --d:3px; }
  .start .cost { position:absolute; left:84px; top:46px; font-size:20px; --s:3px; --d:2px; }

  /* Bottom nav */
  .nav { position:absolute; left:0; right:0; bottom:0; height:103px; background:#1b2242; border-top:3px solid var(--ink); display:flex; }
  .tab { position:relative; flex:1; border:0; background:none; cursor:pointer; border-right:2px solid #161c36; }
  .tab:last-child { border-right:0; }
  .tab.active { background:linear-gradient(#5b6ae8,#4552c9); margin-top:-8px; border-radius:12px 12px 0 0; border:3px solid var(--ink); border-bottom:0; }
  .tab .a { left:50%; top:10px; width:54px; height:54px; transform:translateX(-50%); }
  .tab.active .a { top:14px; width:60px; height:60px; }
  .tab .a.badge, .tab.active .a.badge { left:calc(50% + 8px); top:2px; width:28px; height:28px; transform:none; }
  .tab.active .a.badge, .tab.active .alert { top:6px; }
  .tab { transition:transform .07s; }
  .tab.pressed { transform:scale(.94); }
  .tab .alert { left:calc(50% + 8px); top:2px; }
  .tab .label { position:absolute; left:0; right:0; bottom:14px; font-size:19px; --s:3px; --d:2px; text-align:center; }
</style>
</head>
<body>
<div class="screen" id="screen">

  <img class="a bg" src="assets/background.jpg" alt="">

  <!-- Top bar -->
  <div class="topbar">
    <img class="a" src="assets/avatar.png" style="left:8px;top:76px;width:38px;height:38px" alt="">
    <span class="t" style="position:absolute;left:52px;top:76px;font-size:14px;--s:3px;--d:2px" data-text="Player#166718">Player#166718</span>
    <div class="xp"><i></i></div>
    <div class="lvl"><img class="a" src="assets/level-shield.png" style="inset:0;width:100%;height:100%" alt=""><span class="t" data-text="2">2</span></div>

    <div class="resources">
      <div class="res"><span class="t" data-text="60/60">60/60</span><img src="assets/meat-plus.png" alt=""></div>
      <div class="res"><span class="t" data-text="20">20</span><img src="assets/gem.png" alt=""></div>
      <div class="res"><span class="t" data-text="798">798</span><img src="assets/coin.png" alt=""></div>
    </div>
  </div>

  <!-- Settings -->
  <button class="icon-btn" style="left:14px;top:136px;width:44px;height:44px"><img class="a" src="assets/settings.png" style="inset:0;width:100%;height:100%" alt=""></button>

  <!-- Level content -->
  <div class="stage">
    <!-- Full-width layer so side buttons can stick to the screen edges -->
    <div class="edge-layer">
        <button class="side-btn" style="right:calc(12px * var(--px,1));top:171px;width:62px;height:60px">
          <img class="a" src="assets/calendar.png" style="left:13px;top:2px;width:34px;height:34px" alt="">
          <span class="t" style="top:30px" data-text="Daily">Daily</span>
          <span class="t" style="top:42px" data-text="Rewards">Rewards</span>
          <span class="alert" style="right:-4px;top:-12px"><span class="t" data-text="!">!</span></span>
        </button>
    </div>
    <div class="content">
      <div class="title"><span class="t" data-text="2. City Bridge">2. City Bridge</span></div>
      <div class="sub"><span class="t" data-text="Best Wave: 0/8">Best Wave: 0/8</span></div>

      <img class="a" src="assets/diorama.png" style="left:60px;top:195px;width:340px;height:297px" alt="">


      <button class="side-btn" style="left:193px;top:462px;width:76px;height:60px">
        <img class="a" src="assets/chest.png" style="left:14px;top:-6px;width:46px;height:40px" alt="">
        <span class="t" style="top:30px" data-text="Chapter">Chapter</span>
        <span class="t" style="top:42px" data-text="Rewards">Rewards</span>
      </button>

      <button class="start">
        <span class="t big" data-text="START">START</span>
        <span class="t cost" data-text="5">5</span>
        <img class="a" src="assets/meat.png" style="left:98px;top:46px;width:26px;height:24px" alt="">
      </button>
    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="nav">
    <button class="tab">
      <img class="a" src="assets/shop.png" alt="">
      <span class="alert"><span class="t" data-text="!">!</span></span>
      <span class="t label" data-text="SHOP">SHOP</span>
    </button>
    <button class="tab">
      <img class="a" src="assets/backpack.png" alt="">
      <img class="a badge" src="assets/strength.png" alt="">
      <span class="t label" data-text="GEAR">GEAR</span>
    </button>
    <button class="tab active">
      <img class="a" src="assets/map.png" alt="">
      <span class="t label" data-text="PLAY">PLAY</span>
    </button>
    <button class="tab locked">
      <img class="a" src="assets/lock.png" alt="">
      <span class="t label" data-text="LOCKED">LOCKED</span>
    </button>
    <button class="tab">
      <img class="a" src="assets/dna-tube.png" alt="">
      <img class="a badge" src="assets/upgrade-arrow.png" alt="">
      <span class="t label" data-text="EVOLVE">EVOLVE</span>
    </button>
  </nav>

</div>
<script>
  // Fit the 460-wide design to any screen
  // Always a full page: scale so the 460x903 core fits, then stretch to the screen's shape
  const DESIGN_W = 460, MIN_H = 903;
  const screen = document.getElementById('screen');
  function fit() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const s = Math.min(vw / DESIGN_W, vh / MIN_H);
    screen.style.setProperty('--w', vw / s + 'px');
    screen.style.setProperty('--h', vh / s + 'px');
    screen.style.setProperty('--px', 1 / s);   // real-pixel margins
    screen.style.transform = `scale(${s})`;
  }
  addEventListener('resize', fit);
  fit();

  // Press feedback that works on phones (iOS Safari ignores :active without touch listeners)
  document.querySelectorAll('button').forEach(b => {
    b.addEventListener('pointerdown', () => b.classList.add('pressed'));
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(e => b.addEventListener(e, () => b.classList.remove('pressed')));
  });
  document.addEventListener('touchstart', () => {}, { passive: true });

  document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    if (t.classList.contains('locked')) return;
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
  });
</script>
</body>
</html>
