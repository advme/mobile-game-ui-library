<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#141a2e; }
  * { box-sizing:border-box; }
  body { margin:0; background:#fff; display:flex; justify-content:center; padding:20px 0; font-family:'Rajdhani',sans-serif; font-weight:700; }
  button { font-family:inherit; font-weight:inherit; }

  .screen { position:relative; width:460px; height:1000px; overflow:hidden; border-radius:28px; border:3px solid var(--ink); }

  /* Image asset placeholder (grey box with its prompt number) */
  .ph { position:absolute; background:#c4c4c4; border:2px dashed #8a8a8a; border-radius:8px; display:grid; place-items:center;
        font:600 11px system-ui,sans-serif; color:#555; text-align:center; line-height:1.1; }

  /* Approved text style: thin outline + 3D bottom edge */
  .t { position:relative; display:inline-block; color:#fff; -webkit-text-stroke:var(--s,4px) var(--ink); paint-order:stroke fill; isolation:isolate; white-space:nowrap; }
  .t::before { content:attr(data-text); position:absolute; left:0; right:0; text-align:inherit; top:var(--d,3px); z-index:-1; color:var(--ink); -webkit-text-stroke:var(--s,4px) var(--ink); }

  /* Top bar */
  .topbar { position:absolute; left:0; right:0; top:0; height:120px; background:linear-gradient(#2a4a9a,#223a7c); border-bottom:3px solid var(--ink); }
  .xp { position:absolute; left:64px; top:98px; width:84px; height:11px; background:#16224a; border-radius:3px; overflow:hidden; }
  .xp i { position:absolute; inset:0 30% 0 0; background:#1ed4ff; }
  .res { position:absolute; top:84px; font-size:17px; --s:3px; --d:2px; }

  /* Title */
  .title { position:absolute; left:0; right:0; top:222px; text-align:center; font-size:40px; --s:6px; --d:4px; }
  .sub { position:absolute; left:80px; right:80px; top:266px; height:30px; text-align:center; font-size:17px; --s:3px; --d:2px; padding-top:4px;
         background:linear-gradient(90deg,transparent,rgba(20,30,60,.35) 25%,rgba(20,30,60,.35) 75%,transparent); }

  /* Side buttons */
  .side-btn { position:absolute; border:2px solid rgba(20,26,46,.6); border-radius:10px; background:rgba(40,60,110,.55); cursor:pointer; padding:0; }
  .side-btn .t { position:absolute; left:0; right:0; font-size:12px; --s:3px; --d:2px; text-align:center; }
  .alert { position:absolute; width:24px; height:24px; border-radius:50%; border:2px solid #fff; background:linear-gradient(#ff4b4b,#d81f2a);
           display:grid; place-items:center; font-size:17px; --s:3px; --d:1.5px; box-shadow:0 0 0 2px var(--ink); }
  /* Start button */
  .start { position:absolute; left:128px; top:704px; width:206px; height:80px; border:3px solid var(--ink); border-radius:12px; cursor:pointer;
           background:linear-gradient(#ffd21c,#ffb400); box-shadow:inset 0 -6px 0 #e59400, inset 0 3px 0 rgba(255,255,255,.5), 0 3px 0 var(--ink); transition:transform .07s; }
  .start:active { transform:translateY(3px) scale(.97); }
  .start .big { position:absolute; left:0; right:0; top:4px; font-size:36px; --s:5px; --d:3px; }
  .start .cost { position:absolute; left:84px; top:46px; font-size:20px; --s:3px; --d:2px; }

  /* Bottom nav */
  .nav { position:absolute; left:0; right:0; bottom:0; height:103px; background:#1b2242; border-top:3px solid var(--ink); display:flex; }
  .tab { position:relative; flex:1; border:0; background:none; cursor:pointer; border-right:2px solid #161c36; }
  .tab:last-child { border-right:0; }
  .tab.active { background:linear-gradient(#5b6ae8,#4552c9); margin-top:-8px; border-radius:12px 12px 0 0; border:3px solid var(--ink); border-bottom:0; }
  .tab .ph { left:50%; top:12px; width:50px; height:50px; transform:translateX(-50%); }
  .tab .t { position:absolute; left:0; right:0; bottom:14px; font-size:19px; --s:3px; --d:2px; text-align:center; }
  .tab.active .ph { top:18px; }
  .tab .alert .t { position:relative; bottom:auto; font-size:17px; }
  .tab.locked .t { color:#fff; }
  /* Image assets */
  .a { position:absolute; object-fit:contain; pointer-events:none; }
  .tab .a { left:50%; top:10px; width:54px; height:54px; transform:translateX(-50%); }
  .tab.active .a { top:14px; width:60px; height:60px; }
  .icon-btn { position:absolute; padding:0; border:0; background:none; cursor:pointer; transition:transform .07s; }
  .icon-btn:active, .side-btn:active { transform:scale(.92); }
  .lvl { position:absolute; left:48px; top:90px; width:28px; height:26px; }
  .lvl .t { position:absolute; left:0; right:0; top:1px; text-align:center; font-size:15px; --s:3px; --d:1.5px; }
</style>
</head>
<body>
<div class="screen">

  <img class="a" src="assets/background.jpg" style="inset:0;width:100%;height:100%;object-fit:cover">

  <!-- Top bar -->
  <div class="topbar">
    <img class="a" src="assets/avatar.png" style="left:8px;top:76px;width:38px;height:38px">
    <span class="t res" style="left:52px;top:76px;font-size:14px" data-text="Player#166718">Player#166718</span>
    <div class="xp"><i></i></div>
    <div class="lvl"><img class="a" src="assets/level-shield.png" style="inset:0;width:100%;height:100%"><span class="t" data-text="2">2</span></div>

    <span class="t res" style="left:206px" data-text="60/60">60/60</span>
    <img class="a" src="assets/meat-plus.png" style="left:252px;top:78px;width:36px;height:34px">

    <span class="t res" style="left:314px" data-text="20">20</span>
    <img class="a" src="assets/gem.png" style="left:336px;top:80px;width:36px;height:31px">

    <span class="t res" style="left:390px" data-text="798">798</span>
    <img class="a" src="assets/coin.png" style="left:418px;top:79px;width:33px;height:33px">
  </div>

  <!-- Settings -->
  <button class="icon-btn" style="left:14px;top:158px;width:44px;height:44px"><img class="a" src="assets/settings.png" style="inset:0;width:100%;height:100%"></button>

  <!-- Title -->
  <div class="title"><span class="t" data-text="2. City Bridge">2. City Bridge</span></div>
  <div class="sub"><span class="t" data-text="Best Wave: 0/8">Best Wave: 0/8</span></div>

  <!-- Level diorama -->
  <img class="a" src="assets/diorama.png" style="left:60px;top:345px;width:340px;height:297px">

  <!-- Daily Rewards -->
  <button class="side-btn" style="left:386px;top:321px;width:62px;height:60px">
    <img class="a" src="assets/calendar.png" style="left:13px;top:2px;width:34px;height:34px">
    <span class="t" style="top:30px" data-text="Daily">Daily</span>
    <span class="t" style="top:42px" data-text="Rewards">Rewards</span>
    <span class="alert" style="right:-4px;top:-12px"><span class="t" data-text="!">!</span></span>
  </button>

  <!-- Chapter Rewards -->
  <button class="side-btn" style="left:193px;top:612px;width:76px;height:60px">
    <img class="a" src="assets/chest.png" style="left:14px;top:-6px;width:46px;height:40px">
    <span class="t" style="top:30px" data-text="Chapter">Chapter</span>
    <span class="t" style="top:42px" data-text="Rewards">Rewards</span>
  </button>

  <!-- Start -->
  <button class="start">
    <span class="t big" data-text="START">START</span>
    <span class="t cost" data-text="5">5</span>
    <img class="a" src="assets/meat.png" style="left:98px;top:46px;width:26px;height:24px">
  </button>

  <!-- Bottom nav -->
  <nav class="nav">
    <button class="tab">
      <img class="a" src="assets/shop.png">
      <span class="alert" style="left:56px;top:2px"><span class="t" data-text="!">!</span></span>
      <span class="t" data-text="SHOP">SHOP</span>
    </button>
    <button class="tab">
      <img class="a" src="assets/backpack.png">
      <img class="a" src="assets/strength.png" style="left:58px;top:2px;width:28px;height:28px">
      <span class="t" data-text="GEAR">GEAR</span>
    </button>
    <button class="tab active">
      <img class="a" src="assets/map.png">
      <span class="t" data-text="PLAY">PLAY</span>
    </button>
    <button class="tab locked">
      <img class="a" src="assets/lock.png">
      <span class="t" data-text="LOCKED">LOCKED</span>
    </button>
    <button class="tab">
      <img class="a" src="assets/dna-tube.png">
      <img class="a" src="assets/upgrade-arrow.png" style="left:60px;top:2px;width:28px;height:28px">
      <span class="t" data-text="EVOLVE">EVOLVE</span>
    </button>
  </nav>

</div>
<script>
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    if (t.classList.contains('locked')) return;
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
  });
</script>
</body>
</html>
